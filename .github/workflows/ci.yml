name: CI

# Deliberately has NO `push` or `pull_request` trigger. This suite runs when a release is cut and
# at no other time: a tag push starts release.yml, whose `tests` job calls this one, so the release
# is still gated on the full suite rather than on someone remembering to watch it. Every commit to
# main used to start a run of its own, which is the same suite spending runner minutes twice for
# the one verdict that ends up mattering.
on:
  # The escape hatch that replaces those runs: Actions -> CI -> Run workflow, on any branch, when
  # you want the verdict without cutting a release.
  workflow_dispatch:
  # release.yml calls this. It also hands the release the Flutter version this suite actually ran
  # on (see below), so an artifact can never be built with a toolchain the tests did not use.
  workflow_call:
    outputs:
      flutter-version:
        description: The Flutter the suite ran on. release.yml builds every artifact with it.
        value: ${{ jobs.analyze-test.outputs.flutter-version }}

permissions:
  contents: read

concurrency:
  # Never cancelled in progress: every run left is either a release's gate or one somebody started
  # by hand, and both are the record of whether that commit was green.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      flutter-version: ${{ steps.pin.outputs.flutter-version }}
    steps:
      - uses: actions/checkout@v7

      # THE toolchain pin for the whole repo — CI and every release artifact read this one line,
      # so a release can never be built with a Flutter the suite did not run on.
      #
      # Pinned rather than `channel: stable` unqualified: pubspec.yaml pins `sdk: ^3.13.0`, so
      # anything below Flutter 3.47 dies at `flutter pub get` with "version solving failed", and a
      # floating stable turns an unrelated upstream release into a red build on an untouched commit.
      # Bump deliberately, alongside the local toolchain.
      - id: pin
        run: echo "flutter-version=3.47.2" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter-version }}
          channel: stable
          cache: true

      # `test/support/real_fonts.dart` draws with a REAL face instead of Ahem, whose fixed-square
      # glyphs measure a 24-character label at 276px where Arial measures ~140 — wide enough to
      # invent overflows that do not exist. Liberation Sans and Liberation Mono are the
      # metric-compatible stand-ins for the Arial and Courier New that helper loads on macOS, so
      # the same layout assertions hold on both hosts rather than needing per-OS thresholds.
      - name: Install the fonts the widget tests measure with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation

      - run: flutter pub get

      # --no-fatal-infos, NOT an analyzer exclude: 13 of the repo's 14 infos are lint nits inside
      # third_party/xterm, a deliberately vendored and patched xterm 4.0.0 (see its
      # README.autonomous.md) that must not be reformatted to please a linter.
      #
      # --no-fatal-warnings too, as of 2026-09-09: a warning is real to fix but not worth blocking
      # build-macos/build-linux/publish/github-release over — measured, a single unused-variable
      # warning in a test file did exactly that. ERRORS still fail this job (broken imports, a
      # missing required argument, a real type error) — that class is what a release gate exists for.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Unit + widget suite only (698 tests). integration_test/ needs a real device
      # (-d macos / -d linux) and is deliberately not part of this gate.
      - run: flutter test
